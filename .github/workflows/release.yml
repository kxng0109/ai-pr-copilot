name: Release

# Tag-driven enterprise release: v*.*.* (stable) or v*.*.*-rc.* (prerelease).
# Pipeline: validate tag<->pom -> test -> Trivy fs gate -> build+smoke ->
# image push -> sign+attest -> publish Release immediately.
on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      make-latest: ${{ steps.version.outputs.make-latest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate tag matches pom and derive flags
        id: version
        run: |
          TAGV="${GITHUB_REF_NAME#v}"
          if ! echo "$TAGV" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-(rc|beta|alpha|preview)[.0-9-]*)?$'; then
            echo "Tag $GITHUB_REF_NAME is not valid SemVer"; exit 1
          fi
          POMV=$(./mvnw help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ "$TAGV" != "$POMV" ]; then
            echo "tag $TAGV != pom $POMV"; exit 1
          fi
          if echo "$TAGV" | grep -Eq '-(rc|beta|alpha|preview)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "make-latest=false" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "make-latest=true" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$TAGV" >> "$GITHUB_OUTPUT"
          echo "Releasing version: $TAGV"

  test:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

  trivy-fs:
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trivy filesystem gate (HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: '1'

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy-fs.sarif

  build:
    needs: [validate, test, trivy-fs]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Package (tests already green in test job)
        run: ./mvnw -B -DskipTests package

      - name: Rename artifacts deterministically
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          mv target/ai-pr-copilot-*.jar "target/ai-pr-copilot-${VERSION}.jar"
          cp target/classes/META-INF/sbom/application.cdx.json "target/ai-pr-copilot-${VERSION}-cyclonedx.json"
          cd target
          sha256sum "ai-pr-copilot-${VERSION}.jar" > "ai-pr-copilot-${VERSION}.jar.sha256"
          sha256sum -c "ai-pr-copilot-${VERSION}.jar.sha256"

      - name: Smoke test (actuator health with dummy key)
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          OPENAI_API_KEY=dummy-smoke-key PRCOPILOT_API_KEY=dummy-smoke-key \
          GOOGLE_GENAI_PROJECT_ID=dummy-smoke-project GOOGLE_GENAI_LOCATION=us-central1 \
            java -jar "target/ai-pr-copilot-${VERSION}.jar" > smoke.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/actuator/health | grep -q '"status":"UP"'; then
              echo "Smoke OK"; kill $PID; exit 0
            fi
            sleep 5
          done
          echo "Smoke FAILED"; cat smoke.log; kill $PID; exit 1

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: |
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}.jar
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}.jar.sha256
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}-cyclonedx.json
          if-no-files-found: error
          retention-days: 7

  docker:
    needs: [validate, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata (stable-only latest)
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/ai-pr-copilot
          flavor: latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ needs.validate.outputs.version }}
            AOTCACHE_ENABLED=1
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/ai-pr-copilot:latest
          cache-to: type=inline

      - name: Trivy image gate (HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          image-ref: ghcr.io/${{ github.repository_owner }}/ai-pr-copilot@${{ steps.push.outputs.digest }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'

  sign-attest:
    needs: [validate, build, docker]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: target

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign JAR blob (keyless bundle)
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cosign sign-blob --yes \
            --bundle "target/ai-pr-copilot-${VERSION}.jar.sigstore.json" \
            "target/ai-pr-copilot-${VERSION}.jar"

      - name: Sign image by digest
        run: |
          cosign sign --yes \
            "ghcr.io/${{ github.repository_owner }}/ai-pr-copilot@${{ needs.docker.outputs.digest }}"

      - name: Image SBOM (Syft via sbom-action)
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          image: ghcr.io/${{ github.repository_owner }}/ai-pr-copilot@${{ needs.docker.outputs.digest }}
          format: cyclonedx-json
          output-file: target/ai-pr-copilot-${{ needs.validate.outputs.version }}-image.sbom.cyclonedx.json

      - name: Attest JAR provenance
        uses: actions/attest@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: attest-jar
        with:
          subject-path: target/ai-pr-copilot-${{ needs.validate.outputs.version }}.jar
          push-to-registry: false

      - name: Stage attestation bundle
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          cp "${{ steps.attest-jar.outputs.bundle-path }}" "target/ai-pr-copilot-${VERSION}.attestation.sigstore.json"

      - name: Attest image provenance + SBOM
        uses: actions/attest@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/ai-pr-copilot
          subject-digest: ${{ needs.docker.outputs.digest }}
          push-to-registry: true

      - name: Upload signed artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-${{ needs.validate.outputs.version }}
          path: |
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}.jar.sigstore.json
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}-image.sbom.cyclonedx.json
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}.attestation.sigstore.json
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [validate, build, docker, sign-attest]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: target

      - name: Download signed artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: signed-${{ needs.validate.outputs.version }}
          path: target

      - name: Generate conventional changelog
        id: cliff
        uses: orhun/git-cliff-action@3d96a18cc4ec17e9dc69ddcc424ccafaf1f78ce2 # v4
        with:
          config: cliff.toml
          args: --current --strip header -o CHANGELOG-current.md

      - name: Assemble release notes
        run: |
          VERSION="${{ needs.validate.outputs.version }}"
          {
            echo "## AI PR Copilot ${VERSION}"
            echo ""
            echo "### Verify"
            echo ""
            echo '```bash'
            echo "sha256sum -c ai-pr-copilot-${VERSION}.jar.sha256"
            echo "cosign verify-blob --bundle ai-pr-copilot-${VERSION}.jar.sigstore.json \\"
            echo "  --certificate-identity-regexp 'https://github.com/${{ github.repository }}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ai-pr-copilot-${VERSION}.jar"
            echo '```'
            echo ""
            echo "Container: \`ghcr.io/${{ github.repository_owner }}/ai-pr-copilot:${VERSION}\`"
            echo ""
            echo "### Changes"
            echo ""
            cat CHANGELOG-current.md 2>/dev/null || echo "${{ steps.cliff.outputs.content }}"
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub Release immediately
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ needs.validate.outputs.prerelease }}
          make_latest: ${{ needs.validate.outputs.make-latest }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}.jar
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}.jar.sha256
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}-cyclonedx.json
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}-image.sbom.cyclonedx.json
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}.jar.sigstore.json
            target/ai-pr-copilot-${{ needs.validate.outputs.version }}.attestation.sigstore.json

      - name: Release summary
        run: |
          echo "Release v${{ needs.validate.outputs.version }} published (prerelease=${{ needs.validate.outputs.prerelease }})"
          echo "Image: ghcr.io/${{ github.repository_owner }}/ai-pr-copilot@${{ needs.docker.outputs.digest }}"
