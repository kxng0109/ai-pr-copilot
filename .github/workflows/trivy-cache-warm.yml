name: Trivy cache warm

# Pre-warms the Trivy vulnerability database and Java DB on the default
# branch so scan jobs can run with TRIVY_SKIP_DB_UPDATE=true and never
# hit the network (avoids transient 429s from registry rate limiting).
on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 6 * * *'

permissions: { }

jobs:
  warm:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Update Trivy DB cache
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          vuln-type: os,library
          format: table
          exit-code: '0'
          cache: true