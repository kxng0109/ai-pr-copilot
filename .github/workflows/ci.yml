name: CI

on:
  push:
    branches:
      - main
      - '**'
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build and run tests
        run: bash ./mvnw -B verify

      - name: Upload built artifacts for scanning
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ci-target
          path: target
          if-no-files-found: error
          retention-days: 1

  trivy:
    needs: build-and-test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record date for Trivy cache key
        id: date
        run: echo "date=$(date +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore Trivy DB cache
        uses: actions/cache/restore@9255dc7a253b0ccc959486e2bca901246202afeb # v4
        with:
          path: ${{ github.workspace }}/.cache/trivy
          key: cache-trivy-${{ steps.date.outputs.date }}
          restore-keys: |
            cache-trivy-

      - name: Configure Trivy skip flags
        # TRIVY_SKIP_JAVA_DB_UPDATE is fatal when the cache does not exist
        # ("cannot be specified on the first run"), so only enable skipping
        # once the warm job has actually populated the DBs.
        run: |
          if [ -d "${GITHUB_WORKSPACE}/.cache/trivy/db" ] && [ -d "${GITHUB_WORKSPACE}/.cache/trivy/java-db" ]; then
            echo "TRIVY_SKIP_DB_UPDATE=true" >> "$GITHUB_ENV"
            echo "TRIVY_SKIP_JAVA_DB_UPDATE=true" >> "$GITHUB_ENV"
            echo "Trivy DBs cached; skipping download"
          else
            echo "Trivy cache not present; allowing DB download"
          fi

      - name: Download built artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ci-target
          path: target

      - name: Trivy artifact gate (HIGH/CRITICAL block)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: target
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'